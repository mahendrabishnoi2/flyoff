<!doctype html>
<!--
  Preview of app/src/main/assets/style/flyoff.json in MapLibre GL JS.
  Served by render.js, which also maps /assets/ to app/src/main/assets/.
  Query: ?lng=10&lat=50&zoom=4
  GL JS is a stand-in for MapLibre Native here: close, but not proof.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyoff basemap preview</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pmtiles@4.5.0/dist/pmtiles.js"></script>
<style>
  html, body, #map { margin: 0; height: 100%; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  // MapLibre Native reads asset:// itself; GL JS can't, so point those URLs
  // at the local server's /assets/ instead.
  const assets = new URL('/assets/', location.href).href;
  const fromAsset = (url) => url.replace('asset://', assets);

  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol('pmtiles', protocol.tile);

  const q = new URLSearchParams(location.search);
  window.previewErrors = [];

  fetch(assets + 'style/flyoff.json')
    .then((r) => r.json())
    .then((style) => {
      for (const src of Object.values(style.sources)) {
        if (src.url) src.url = src.url.replace('pmtiles://asset://', 'pmtiles://' + assets);
      }
      style.glyphs = fromAsset(style.glyphs);
      const map = new maplibregl.Map({
        container: 'map',
        style,
        center: [Number(q.get('lng') ?? 0), Number(q.get('lat') ?? 20)],
        zoom: Number(q.get('zoom') ?? 1),
        attributionControl: { compact: false },
        fadeDuration: 0,
      });
      map.on('error', (e) => window.previewErrors.push(String(e.error?.message ?? e.error ?? e)));
      map.once('idle', () => { window.previewReady = true; });
      window.map = map;
    })
    .catch((e) => { window.previewErrors.push(String(e)); window.previewReady = true; });
</script>
</body>
</html>
